<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audiomovers — Music production & mixing — Relume wireframe</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.js"></script>
<script>
tailwind.config = {
  theme: {
    container: { center: true },
    extend: {
      colors: {
        'scheme-border': '#dcdcdc', 'scheme-text': '#141414', 'scheme-background': '#fff', 'scheme-foreground': '#fff',
        'neutral-darkest': '#141414', neutral: { DEFAULT: '#5f5f5f', lightest: '#efefef' },
      },
      borderRadius: { button: '0', card: '0', badge: '0', image: '0' },
      fontSize: {
        h1: ['56px', { lineHeight: '1.06', fontWeight: '700', letterSpacing: '-0.02em' }], h2: ['44px', { lineHeight: '1.1', letterSpacing: '-0.01em' }],
        h3: ['40px', { lineHeight: '1.1', letterSpacing: '-0.01em' }], h4: ['30px', { lineHeight: '1.2' }],
        h5: ['24px', { lineHeight: '1.3' }], h6: ['19px', { lineHeight: '1.4' }],
        medium: ['17px', { lineHeight: '1.55' }], small: ['13px', { lineHeight: '1.5' }],
      },
      spacing: { 18: '4.5rem' }, maxWidth: { xxs: '16rem' }, minHeight: { 18: '4.5rem' },
    },
  },
};
</script>
<style>
body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#5f5f5f;background:#fff;font-size:15px;line-height:1.55}
h1,h2,h3,h4,h5,h6{color:#141414}
@media (max-width:767px){
  .text-h1{font-size:35px!important}
  .text-h2{font-size:27px!important}
  .text-h3{font-size:25px!important}
  .text-h4{font-size:22px!important}
  .text-h5{font-size:19px!important}
}
#root > div > section{border-bottom:1px solid #ededed}
[data-slot=card] p{color:#5f5f5f}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="jsx-src">
/* Vendored Relume v3.7 sections (navbar2, header1, layout303, cta7, logo2, blog39, blog60, footer14).
   Adaptations for no-build environment: cn() replaces clsx/tailwind-merge; variant maps replace cva;
   inline SVGs replace relume-icons; CSS transitions replace motion/react in Navbar2. Class strings unchanged. */
const { useState, useEffect } = React;
const cn = (...a) => a.filter(Boolean).join(" ");

// components/ui/button.tsx — variant/size class strings verbatim from Relume kit
const buttonBase = "inline-flex items-center justify-center gap-3 rounded-button whitespace-nowrap text-[14px] font-semibold transition-all duration-200 ease-in-out focus-visible:outline-none disabled:pointer-events-none disabled:opacity-50 lg:text-[16px]";
const buttonVariantCls = {
  default: "bg-neutral-darkest text-white hover:bg-[#3c3c3c]",
  // secondary matches primary hover: same grey fill, text flips white
  alternate: "border border-white bg-white text-neutral-darkest hover:border-[#3c3c3c] hover:bg-[#3c3c3c] hover:text-white",
  secondary: "border border-scheme-border bg-white text-scheme-text hover:border-[#3c3c3c] hover:bg-[#3c3c3c] hover:text-white",
  link: "gap-2 text-scheme-text hover:underline hover:underline-offset-4", ghost: "hover:bg-neutral-darkest hover:text-white", none: "",
};
const buttonSizeCls = { default: "px-6 py-3", sm: "px-5 py-2", link: "p-0", icon: "size-10", none: "" };
const Button = ({ className, variant = "default", size = "default", iconLeft, iconRight, children, ...props }) => (
  <button data-slot="button" className={cn(buttonBase, buttonVariantCls[variant], buttonSizeCls[size], className)} {...props}>
    {iconLeft}{children}{iconRight}
  </button>
);
// components/ui/card.tsx
const Card = ({ className, ...props }) => (
  <div data-slot="card" className={cn("overflow-hidden rounded-card border border-scheme-border bg-scheme-foreground text-scheme-text transition-colors duration-200 hover:border-[#8a8a8a]", className)} {...props} />
);
// components/ui/badge.tsx
const Badge = ({ className, ...props }) => (
  <span data-slot="badge" className={cn("inline-flex items-center rounded-badge px-2 py-[0.175rem] text-sm leading-[1.5] font-semibold border border-neutral-lightest bg-neutral-lightest text-neutral-darkest", className)} {...props} />
);
// relume-icons substitutes
const ChevronRight = ({ className }) => (<svg className={cn("size-4", className)} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 6 6 6-6 6"/></svg>);
const KeyboardArrowDown = ({ className }) => (<svg className={cn("size-5", className)} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>);
const RelumeIcon = ({ className }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18"/><path d="m3 9 6-6m3 18L21 12"/></svg>);
const SearchIcon = ({ className }) => (<svg className={cn("size-5", className)} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>);
const socialGlyphs = {
  facebook: <path d="M13.5 21v-7h2.3l.4-3h-2.7V9.1c0-.9.3-1.5 1.5-1.5h1.3V4.9c-.6-.1-1.4-.2-2.3-.2-2.3 0-3.8 1.4-3.8 3.9V11H8v3h2.2v7h3.3z" fill="currentColor" stroke="none" />,
  instagram: <g><rect x="4.5" y="4.5" width="15" height="15" rx="4" /><circle cx="12" cy="12" r="3.4" /><circle cx="16.6" cy="7.4" r="0.6" fill="currentColor" stroke="none" /></g>,
  x: <path d="M5 5l6 7.6L5.3 19h2.2l4.5-5.1L16 19h3.2l-6.3-8L18.6 5h-2.2l-4.1 4.7L8.2 5H5z" fill="currentColor" stroke="none" />,
  linkedin: <g><rect x="5" y="10" width="3" height="9" fill="currentColor" stroke="none" /><circle cx="6.5" cy="6.5" r="1.6" fill="currentColor" stroke="none" /><path d="M11 19v-9h3v1.4c.5-.9 1.5-1.6 3-1.6 2.3 0 3.5 1.5 3.5 4.1V19h-3v-4.6c0-1.3-.5-2.1-1.6-2.1-1.2 0-1.9.9-1.9 2.1V19h-3z" fill="currentColor" stroke="none" /></g>,
  youtube: <g><rect x="3.5" y="6.5" width="17" height="11" rx="3" /><path d="M10.5 9.8v4.4l4-2.2-4-2.2z" fill="currentColor" stroke="none" /></g>,
};
const SocialIcon = ({ kind, className }) => (
  <span className={cn("flex size-9 items-center justify-center rounded-full border border-scheme-border transition-colors hover:bg-neutral-darkest hover:text-white", className)}>
    <svg className="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">{socialGlyphs[kind]}</svg>
  </span>
);
const stripeSvg = (w, h, label) => {
  const text = (label || "Image").toUpperCase().replace(/&/g, "&amp;");
  const fs = 10;
  return "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'><rect width='${w}' height='${h}' fill='#f4f4f4'/><text x='50%' y='50%' text-anchor='middle' dominant-baseline='middle' font-family='SFMono-Regular,Menlo,Consolas,monospace' font-size='${fs}' letter-spacing='1.5' fill='#9a9a9a'>${text}</text></svg>`);
};
const ph = (label, w = 800, h = 450) => stripeSvg(w, h, label);
const PLACEHOLDER = stripeSvg(800, 800);
const PLACEHOLDER_L = stripeSvg(800, 450);

// ---- Promo banner — slim announcement bar above the nav (CMS-swappable) ----
const PromoBanner = ({ text, cta }) => (
  <div className="flex items-center justify-center gap-3 bg-neutral-darkest px-[5%] py-2.5 text-center">
    <p className="text-small text-white">{text}</p>
    <a href="#" data-route={cta["data-route"]} className="whitespace-nowrap text-small font-semibold text-white underline underline-offset-2 hover:opacity-70">{cta.title}</a>
  </div>
);

// ---- Navbar2 (Relume) — motion animations replaced with CSS ----
const Navbar2 = ({ logo, navLinks, buttons }) => {
  const [open, setOpen] = useState(false);
  const [isMobile, setIsMobile] = useState(() => window.matchMedia("(max-width: 991px)").matches);
  useEffect(() => {
    const mq = window.matchMedia("(max-width: 991px)");
    const h = () => setIsMobile(mq.matches);
    mq.addEventListener ? mq.addEventListener("change", h) : mq.addListener(h);
    return () => (mq.removeEventListener ? mq.removeEventListener("change", h) : mq.removeListener(h));
  }, []);
  return (
    <section className="sticky top-0 z-[999] flex w-full items-center border-b border-scheme-border bg-scheme-background lg:min-h-18 lg:px-[5%]">
      <div className="mx-auto size-full lg:grid lg:grid-cols-[0.375fr_1fr_0.375fr] lg:items-center lg:justify-between lg:gap-4">
        <div className="flex min-h-16 items-center justify-between px-[5%] md:min-h-18 lg:min-h-full lg:px-0">
          <a href={logo.url} className="flex items-center"><img src="uploads/audiomovers-logo.svg" alt="Audiomovers" style={{ height: 21, width: "auto" }} /></a>
          <div className="flex items-center gap-2 lg:hidden">
            <a href="#" data-route="/search" aria-label="Search" className="flex size-10 items-center justify-center text-black"><SearchIcon /></a>
            <div className="flex items-center gap-2">{buttons.filter(b => b.variant !== "link").map((b, i) => (<Button key={i} className="px-3 py-1" size="sm" {...b}>{b.title}</Button>))}</div>
            <button className="-mr-2 flex size-12 flex-col items-center justify-center" onClick={() => setOpen(p => !p)} data-route="[toggle mobile nav]">
              <span className="my-[3px] h-0.5 w-6 bg-scheme-text" style={{ transition: "transform .2s", transform: open ? "translateY(8px) rotate(-45deg)" : "none" }} />
              <span className="my-[3px] h-0.5 w-6 bg-scheme-text" style={{ transition: "width .2s", width: open ? 0 : "1.5rem" }} />
              <span className="my-[3px] h-0.5 w-6 bg-scheme-text" style={{ transition: "transform .2s", transform: open ? "translateY(-8px) rotate(45deg)" : "none" }} />
            </button>
          </div>
        </div>
        <div className="overflow-hidden px-[5%] text-center lg:flex lg:items-center lg:justify-center lg:overflow-visible lg:px-0"
          style={isMobile ? { height: open ? "auto" : 0, transition: "height .4s" } : {}}>
          {isMobile && <a href="#" data-route="my.audiomovers.com — login" className="block py-3 text-base font-semibold">Log in</a>}
          {navLinks.map((nl, i) => nl.mega
            ? <MegaMenu key={i} navLink={nl} isMobile={isMobile} />
            : nl.subMenuLinks && nl.subMenuLinks.length > 0
            ? <SubMenu key={i} navLink={nl} isMobile={isMobile} />
            : <a key={i} href={nl.url} className="block py-3 text-base text-black hover:underline hover:underline-offset-4 first:pt-7 lg:px-4 lg:py-2 first:lg:pt-2">{nl.title}</a>)}
        </div>
        <div className="hidden items-center gap-2 justify-self-end lg:flex">
          <a href="#" data-route="/search" aria-label="Search" className="flex size-10 items-center justify-center text-black transition-colors hover:bg-neutral-lightest"><SearchIcon /></a>
          {buttons.map((b, i) => (<Button key={i} className="whitespace-nowrap px-4 py-2" size="sm" {...b}>{b.title}</Button>))}
        </div>
      </div>
    </section>
  );
};
const MegaMenu = ({ navLink, isMobile }) => {
  const [dd, setDd] = useState(false);
  const m = navLink.mega;
  return (
    <section className="lg:relative" onMouseEnter={() => !isMobile && setDd(true)} onMouseLeave={() => !isMobile && setDd(false)}>
      <p role="button" className="flex w-full cursor-pointer items-center justify-center gap-1.5 py-3 text-center text-base text-black lg:w-auto lg:flex-none lg:justify-start lg:px-4 lg:py-2" onClick={() => setDd(p => !p)}>
        <span>{navLink.title}</span>
        <span style={{ transition: "transform .3s", transform: dd ? "rotate(180deg)" : "none" }}><KeyboardArrowDown className="text-scheme-text" /></span>
      </p>
      {dd && (
        <div className="bg-scheme-background lg:absolute lg:left-1/2 lg:top-full lg:z-50 lg:w-max lg:-translate-x-1/2 lg:border lg:border-[#d8d8d8] lg:bg-white lg:p-8" style={{ boxShadow: "0 10px 28px rgba(0,0,0,.14)" }}>
          <div className="grid grid-cols-1 gap-6 text-left lg:grid-cols-[minmax(230px,max-content)_minmax(230px,max-content)_230px]">
            {m.columns.map((col, i) => (
              <div key={i} className="flex flex-col lg:border-r lg:border-[#ededed] lg:pr-10">
                <p className="mb-2 text-small text-neutral">{col.heading}</p>
                {col.links.map((s, j) => (
                  <a key={j} href={s.url} data-route={s["data-route"]} className="-mx-3 block whitespace-nowrap px-3 py-2.5 text-left text-black transition-colors hover:bg-neutral-lightest">
                    <span>{s.title}</span>
                  </a>
                ))}
                {col.cta && <a href="#" data-route={col.cta["data-route"]} className="mt-1 py-2.5 text-base font-semibold text-black hover:underline hover:underline-offset-4">{col.cta.title} →</a>}
              </div>
            ))}
            <div className="flex flex-col">
              <img src={m.promo.image} alt={m.promo.heading} className="mb-3 aspect-video w-full object-cover" />
              <p className="mb-2 text-small font-semibold text-black">{m.promo.heading}</p>
              <a href="#" data-route={m.promo.cta["data-route"]} className="text-small font-semibold text-black hover:underline hover:underline-offset-4">{m.promo.cta.title} →</a>
            </div>
          </div>
        </div>
      )}
    </section>
  );
};
const SubMenu = ({ navLink, isMobile }) => {
  const [dd, setDd] = useState(false);
  return (
    <section className="relative" onMouseEnter={() => !isMobile && setDd(true)} onMouseLeave={() => !isMobile && setDd(false)}>
      <p role="button" className="flex w-full cursor-pointer items-center justify-center gap-1.5 py-3 text-center text-base text-black lg:w-auto lg:flex-none lg:justify-start lg:px-4 lg:py-2" onClick={() => setDd(p => !p)}>
        <span>{navLink.title}</span>
        <span style={{ transition: "transform .3s", transform: dd ? "rotate(180deg)" : "none" }}><KeyboardArrowDown className="text-scheme-text" /></span>
      </p>
      {dd && (
        <div className="bg-scheme-background lg:absolute lg:top-full lg:z-50 lg:left-1/2 lg:min-w-[290px] lg:-translate-x-1/2 lg:border lg:border-[#d8d8d8] lg:bg-white lg:p-2" style={{ boxShadow: "0 10px 28px rgba(0,0,0,.14)" }}>
          {navLink.subMenuLinks.map((s, i) => s.divider
            ? <div key={i} className="mx-3 my-2 h-px bg-[#ededed] lg:mx-0" />
            : (
              <a key={i} href={s.url} data-route={s["data-route"]} className={"block px-4 py-2.5 text-center text-black transition-colors hover:bg-neutral-lightest lg:px-3 lg:text-left " + (s.bold ? "font-semibold" : "")}>
                <span className="flex items-center justify-between gap-3 whitespace-nowrap"><span>{s.title}</span>{s.tag && <span className="text-[11px] font-semibold text-[#2f6fd0]">{s.tag}</span>}</span>
                {s.desc && <span className="mt-0.5 block max-w-[300px] text-[12px] leading-snug text-neutral">{s.desc}</span>}
              </a>
            ))}
        </div>
      )}
    </section>
  );
};

// ---- Header1 (Relume, verbatim structure) ----
const Header1 = ({ heading, description, buttons, image, annotationChip, subBold, subGrey, trustLine }) => (
  <section className="flex items-center px-[5%] py-12 md:py-14 lg:py-16" style={{ minHeight: "calc(min(100vh, 810px) - 111.5px)" }}>
    <div className="container">
      <div className="grid grid-cols-1 gap-x-20 gap-y-12 md:gap-y-16 lg:grid-cols-2 lg:items-center">
        <div>
          {annotationChip && <div className="mb-4"><Badge>{annotationChip}</Badge></div>}
          <h1 className="mb-5 text-h1 font-bold md:mb-6">{heading}</h1>
          <p className="text-medium">{description}</p>
          <div className="mt-6 flex flex-wrap gap-4 md:mt-8">
            {buttons.map((b, i) => {
              const { note, title, ...rest } = b;
              return (
                <Button key={i} {...rest} className="px-6 py-2.5">
                  <span className="flex flex-col items-start">
                    <span>{title}</span>
                    {note && <span className="text-[12px] font-normal opacity-60">{note}</span>}
                  </span>
                </Button>
              );
            })}
          </div>
          {(subBold || subGrey) && <div className="mt-5">
            {subBold && <p className="text-small font-bold text-black">{subBold}</p>}
            {subGrey && <p className="text-small text-neutral">{subGrey}</p>}
          </div>}
          {trustLine && <div className="mt-5 inline-flex items-center gap-2 border border-scheme-border bg-white px-3 py-2 text-small text-black"><span className="size-2 rounded-full bg-black"></span>{trustLine}</div>}
        </div>
        <div><img src={image.src} className="w-full rounded-image object-cover" style={{ maxHeight: "calc(min(100vh, 810px) - 240px)" }} alt={image.alt} /></div>
      </div>
    </div>
  </section>
);

// ---- Layout303 (Relume, verbatim structure) ----
const Layout303 = ({ heading, sections }) => (
  <section className="bg-white px-[5%] py-12 md:py-16">
    <div className="container">
      <div className="mb-8 max-w-3xl md:mb-10"><h2 className="text-h3 font-bold">{heading}</h2></div>
      <div className="grid grid-cols-1 gap-y-12 md:grid-cols-2 md:gap-x-8 md:gap-y-16 lg:grid-cols-4">
        {sections.map((s, i) => (
          <div key={i}>
            <div className="mb-5 md:mb-6"><div className="size-12 border border-scheme-border bg-neutral-lightest"></div></div>
            <h3 className="mb-3 text-h5 font-bold md:mb-4">{s.heading}</h3>
            <p>{s.description}</p>
          </div>
        ))}
      </div>
    </div>
  </section>
);

// ---- Layout1 (Relume, verbatim structure) — flippable image side via `flip` (adaptation) ----
const Layout1 = ({ tagline, heading, description, buttons, image, flip }) => (
  <section className="px-[5%] py-16 md:py-24 lg:py-28">
    <div className="container">
      <div className="grid grid-cols-1 gap-y-12 md:grid-cols-2 md:items-center md:gap-x-12 lg:gap-x-20">
        <div className={flip ? "md:order-2" : ""}>
          <p className="mb-3 font-semibold md:mb-4">{tagline}</p>
          <h1 className="mb-5 text-h2 font-bold md:mb-6">{heading}</h1>
          <p className="text-medium">{description}</p>
          <div className="mt-6 flex flex-wrap items-center gap-4 md:mt-8">
            {buttons.map((b, i) => (<Button key={i} {...b}>{b.title}</Button>))}
          </div>
        </div>
        <div className={flip ? "md:order-1" : ""}><img src={image.src} className="w-full rounded-image object-cover" alt={image.alt} /></div>
      </div>
    </div>
  </section>
);

// ---- Layout307 (Relume, verbatim structure) ----
const Layout307 = ({ heading, sections }) => (
  <section className="px-[5%] py-16 md:py-24 lg:py-28">
    <div className="container">
      <div className="mb-12 max-w-lg md:mb-18 lg:mb-20"><h2 className="text-h3 font-bold">{heading}</h2></div>
      <div className="grid grid-cols-1 gap-y-12 md:grid-cols-2 md:gap-x-8 md:gap-y-16 lg:grid-cols-4 lg:gap-y-16">
        {sections.map((s, i) => (
          <div key={i}>
            <div className="mb-5 md:mb-6"><img src={s.image.src} alt={s.image.alt} className="rounded-image" /></div>
            <h3 className="mb-3 text-h5 font-bold md:mb-4">{s.heading}</h3>
            <p>{s.description}</p>
            <div className="mt-6 flex gap-4 md:mt-8"><Button variant="link" size="link" iconRight={<ChevronRight className="text-scheme-text" />} {...s.button}>{s.button.title}</Button></div>
          </div>
        ))}
      </div>
    </div>
  </section>
);

// ---- Product routing grid — custom composition on Card/Badge/Button primitives (no clean Relume match — flag custom) ----
const RoutingGrid = ({ heading, description, cards, alsoLabel, chips }) => (
  <section className="px-[5%] py-10 md:py-14 lg:py-16">
    <div className="container">
      <div className="mx-auto mb-10 max-w-lg text-center md:mb-12">
        <h2 className="mb-3 text-h3 font-bold">{heading}</h2>
        <p className="text-medium">{description}</p>
      </div>
      <div className="mb-8 grid grid-cols-1 gap-6 md:grid-cols-2">
        {cards.map((c, i) => (
          <Card key={i} className="p-6">
            <img src={c.image.src} alt={c.image.alt} className="mb-5 aspect-video w-full object-cover" />
            <div className="mb-3 flex flex-wrap gap-2">{c.tags.map((t, j) => (<Badge key={j}>{t}</Badge>))}</div>
            <h3 className="mb-2 text-h5 font-bold">{c.name}</h3>
            <p className="mb-5">{c.desc}</p>
            <div className="flex flex-wrap gap-3">
              <Button {...c.cta}>{c.cta.title}</Button>
              <Button variant="secondary" {...c.learn}>Learn more</Button>
            </div>
          </Card>
        ))}
      </div>
      <div className="grid grid-cols-2 gap-4 md:grid-cols-5">
        <span className="col-span-2 text-small font-semibold text-neutral md:col-span-5">{alsoLabel}</span>
        {chips.map((t, i) => (
          <Card key={i} className="flex flex-col p-4">
            <img src={t.image.src} alt={t.title} className="mb-3 aspect-video w-full object-cover" />
            <h4 className="mb-3 text-h6 font-bold">{t.title}</h4>
            <div className="mt-auto"><Button variant="link" size="link" iconRight={<ChevronRight className="text-scheme-text" />} data-route={t["data-route"]}>Learn more</Button></div>
          </Card>
        ))}
      </div>
    </div>
  </section>
);

// ---- Discipline router — custom composition on Card primitive ----
const Disciplines = ({ heading, description, cards }) => (
  <section className="bg-white px-[5%] py-16 md:py-24">

            <h3 className="mb-1 text-h6 font-bold">{t}</h3>
            <p className="mb-3 text-small text-neutral">{d}</p>
            <span className="text-small font-semibold">Explore →</span>
          </Card>
        ))}
      </div>
    </div>
  </section>
);

const App = () => {
  const [route, setRoute] = useState(null);
  const onClickCapture = (e) => {
    const t = e.target.closest("a, button[data-slot=button]");
    if (!t) return;
    const dest = t.dataset.route || t.getAttribute("href");
    if (!dest || dest === "#") return;
    e.preventDefault();
    if (dest === "relume-home" || dest === "/") { window.location.href = "relume-home.html" + window.location.search; return; }
    if (dest.indexOf("#") === 0) { const el = document.getElementById(dest.slice(1)); if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 110; window.scrollTo({ top: y, behavior: "smooth" }); } return; }
    if (dest.indexOf("/industry/music") === 0) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (dest.indexOf("/sectors/education") === 0) { window.location.href = "relume-sectors-education.html" + window.location.search; return; }
    if (dest.indexOf("/sectors/students") === 0) { window.location.href = "relume-sectors-students.html" + window.location.search; return; }
    if (dest.indexOf("/sectors/business") === 0) { window.location.href = "relume-sectors-business.html" + window.location.search; return; }
    if (dest.indexOf("/downloads") === 0) { window.location.href = "relume-downloads.html" + window.location.search; return; }
    if (dest === "/news" || dest.indexOf("/news?") === 0) { window.location.href = "relume-news.html" + window.location.search; return; }
    if (dest.indexOf("/products/listento") === 0) { window.location.href = "relume-listento.html" + window.location.search; return; }
    if (dest.indexOf("/products/omnibus") === 0) { window.location.href = "relume-omnibus.html" + window.location.search; return; }
    if (dest.indexOf("/pricing/listento") === 0) { window.location.href = "relume-pricing-listento.html" + window.location.search; return; }
    if (dest.indexOf("/press") === 0) { window.location.href = "relume-press.html" + window.location.search; return; }
    if (dest.indexOf("/podcast") === 0) { window.location.href = "relume-podcast.html" + window.location.search; return; }
    if (dest.indexOf("/search") === 0) { window.location.href = "relume-search.html" + window.location.search; return; }
    if (dest.indexOf("/about") === 0) { window.location.href = "relume-about.html" + window.location.search; return; }
    if (dest.indexOf("/terms") === 0 || dest.indexOf("/privacy") === 0 || dest.indexOf("/ccpa") === 0) { window.location.href = "relume-legal.html" + window.location.search; return; }
    if (dest.indexOf("/support/get-help") === 0) { window.location.href = "relume-support.html" + window.location.search; return; }
    setRoute(dest);
  };
  return (
    <div onClickCapture={onClickCapture}>
      <Annot><span>00 · PROMO BANNER — shared sitewide</span><span>CMS campaign slot</span></Annot>
      <PromoBanner text="Black Friday: 40% off OMNIBUS until Dec 1" cta={{ title: "Shop the sale", "data-route": "/products/omnibus" }} />
      <Annot><span>01 · NAVBAR — navbar2 (shared) · contextual CTA = Explore the toolkit (scrolls to toolkit)</span><span>Solutions → Industry → Music production & mixing = current page</span></Annot>
      <Navbar2 {...nav} />
      <Annot><span>02 · INDUSTRY HERO — NEW page type: workflow-first framing (session language, not product features) · draft copy, structure = first draft to react to</span><span>no pricing anywhere on this page — links out to product pages · secondary CTA routes facility/team interest to Business</span></Annot>
      <MixHero />
      <Annot><span>03 · PROOF BANNER — logo2 (shared) · placeholder names, same pattern as Business page</span><span>award mentions / press quotes can slot in later</span></Annot>
      <Logo2 heading="Trusted in mix rooms and studios including" logos={["Abbey Road Studios", "Capitol Studios", "Universal Music Group", "Sony Music", "Metropolis"]} artistsLine="Plus the engineers and producers behind records you already know — real proof points at design stage" />
      <Annot><span>04 · TOOLKIT — core section: products grouped by role in the workflow (review & collaboration / routing & utilities), why-this-matters-for-mixing copy per card</span><span>GLIMPSE inclusion flagged TBC (video/LISTENTO categorisation unsettled) · no pricing — cards link out to product pages</span></Annot>
      <Toolkit />
      <Annot><span>05 · HOW IT FITS TOGETHER — numbered session flow: routing → streaming → sign-off · the cross-product view no product page can show</span><span>could become a proper diagram at design stage</span></Annot>
      <HowItFits />
      <Annot><span>06 · CASE STUDIES & INSIGHTS — 3-up card grid (blog39 pattern, shared) · mix-workflow-relevant stories only</span><span>all placeholder content — real case studies / articles TBC · detail pages to build</span></Annot>
      <CaseStudies />
      <Annot><span>07 · FACILITY CROSS-LINK — team/studio-level interest routes to Business page</span><span>keeps this page workflow-focused, no duplicated enterprise pitch</span></Annot>
      <FacilityAngle />
      <Annot><span>08 · OTHER INDUSTRIES — escape hatch for wrong-workflow landings</span><span>Film & TV + Games & broadcast industry pages still to build</span></Annot>
      <OtherIndustries />
      <Annot><span>09 · FOOTER — footer14 (shared)</span><span></span></Annot>
      <Footer14
        logoText="AUDIOMOVERS"
        description="Remote audio collaboration, powered by Abbey Road."
        columnLinks={[
          { title: "Products", links: [{ title: "LISTENTO", url: "/products/listento" }, { title: "GLIMPSE", url: "/products/glimpse" }, { title: "OMNIBUS 3", url: "/products/omnibus" }, { title: "MINIBUS", url: "/products/minibus" }, { title: "Binaural Renderer", url: "/products/binaural-renderer-for-apple-music" }, { title: "INJECT", url: "/products/inject" }, { title: "AirCaster", url: "/products/aircaster" }] },
          { title: "Sectors", links: [{ title: "Business", url: "/sectors/business" }, { title: "Education", url: "/sectors/education" }, { title: "Students", url: "/sectors/students" }] },
          { title: "Pricing", links: [{ title: "LISTENTO", url: "/pricing/listento" }, { title: "GLIMPSE", url: "/pricing/glimpse" }] },
          { title: "Company", links: [{ title: "About Us", url: "/about" }, { title: "Press", url: "/press" }, { title: "Support", url: "/support/get-help" }, { title: "Contact", url: "/support/contact-us" }] },
          { title: "Explore", links: [{ title: "Downloads", url: "/downloads" }, { title: "News", url: "/news" }, { title: "Podcast", url: "/podcast" }] },
        ]}
        legalLinks={[{ title: "Terms", url: "/terms" }, { title: "Privacy Policy", url: "/privacy" }, { title: "CCPA Policy", url: "/ccpa" }, { title: "Abbey Road Studios ↗", url: "https://www.abbeyroad.com" }]}
        footerText="© 2026 Audiomovers · An Abbey Road Studios company"
      />
      {route && (
        <div style={{ position: "fixed", left: "50%", bottom: 16, transform: "translateX(-50%)", zIndex: 1000, maxWidth: "92%" }}
          className="flex items-center gap-3 whitespace-nowrap border border-scheme-border bg-neutral-darkest px-5 py-3 text-small text-white">
          <span style={{ opacity: .6 }}>Flow →</span><span className="font-semibold" style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{route}</span>
          <span style={{ opacity: .6 }}>wireframe not built yet</span>
          <span style={{ cursor: "pointer", opacity: .7 }} onClick={() => setRoute(null)}>×</span>
        </div>
      )}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
window.addEventListener('load', function () {
  try {
    var src = document.getElementById('jsx-src').textContent;
    var out = Babel.transform(src, { presets: [[Babel.availablePresets.react, { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  } catch (e) {
    document.getElementById('root').innerHTML = '<pre style="padding:24px;color:#c00;white-space:pre-wrap">' + (e.message || e) + '</pre>';
  }
});
</script>
