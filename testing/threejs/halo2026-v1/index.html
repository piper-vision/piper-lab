<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // lab.piper.vision serves this page at an extensionless URL with no
    // trailing slash, which makes ./src, ./vendor and ./assets resolve one level up.
    // Injecting <base> pins relative URLs (incl. the import map) to this page.
    // It must come before anything with a relative URL: the @font-face in the
    // <style> below resolves its url() as soon as it is parsed.
    (function () {
      var p = location.pathname;
      if (!/\.[a-z0-9]+$/i.test(p) && p.charAt(p.length - 1) !== '/') {
        document.write('<base href="' + p + '/">');
      }
    })();
  </script>
  <title>Iso H</title>
  <!-- inline favicon: no /favicon.ico request, so no 404 on the server -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M9%204%20L9%2028%20M23%204%20L23%2028%20M9%2016%20L23%2016'%20fill='none'%20stroke='%23222'%20stroke-width='3'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; background: #fff8e6; overflow-x: hidden; }
    #scene { position: fixed; inset: 0; }
    /* empty spacer that gives the page its scroll distance (height set from config) */
    #scroll { position: relative; height: 500vh; pointer-events: none; }
    canvas { display: block; }
    @font-face {
      font-family: 'FK Display';
      src: url('./assets/fonts/FKDisplay-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    /* Tagline: fixed over the canvas (so it holds still while the gallery flies
       past); once the hero's scroll is used up it scrolls away with the page as
       #intro arrives. Each line is revealed with a small 3D tip-up driven by the
       scroll (see updateTagline). */
    #tagline {
      position: fixed;
      inset: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      perspective: 1100px;
      font-family: 'FK Display', system-ui, sans-serif;
      font-weight: 400;
      font-size: min(7.6vw, 13vh);
      line-height: 1;
      letter-spacing: -0.01em;
      color: #0b0b0b;
      text-align: center;
    }
    #tagline .line {
      display: block;
      white-space: nowrap;
      transform-origin: 50% 100%;
      opacity: 0;
      will-change: transform, opacity;
    }
    /* First homepage section. The hero ends on the yellow circle filling the
       screen, so this starts the same yellow and scrolls up over the fixed
       canvas seamlessly. Placeholder until the real layout/content lands. */
    #intro {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      background: #e5ff00;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <div id="scene"></div>
  <h1 id="tagline">
    <span class="line">Raising the bar</span>
    <span class="line">for temporary</span>
    <span class="line">structures.</span>
  </h1>
  <div id="scroll"></div>
  <section id="intro"></section>
  <!-- inline import (not a static src) so the preload scanner can't fetch it
       before the <base> fix above takes effect -->
  <script type="module">import './src/main.js';</script>
</body>
</html>
