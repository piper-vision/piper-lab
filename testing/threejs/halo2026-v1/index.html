<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // lab.piper.vision serves this page at an extensionless URL with no
    // trailing slash, which makes ./src, ./vendor and ./assets resolve one level up.
    // Injecting <base> pins relative URLs (incl. the import map) to this page.
    // It must come before anything with a relative URL: the @font-face in the
    // <style> below resolves its url() as soon as it is parsed.
    (function () {
      var p = location.pathname;
      if (!/\.[a-z0-9]+$/i.test(p) && p.charAt(p.length - 1) !== '/') {
        document.write('<base href="' + p + '/">');
      }
    })();
  </script>
  <title>Iso H</title>
  <!-- inline favicon: no /favicon.ico request, so no 404 on the server -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M9%204%20L9%2028%20M23%204%20L23%2028%20M9%2016%20L23%2016'%20fill='none'%20stroke='%23222'%20stroke-width='3'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; background: #fff8e6; overflow-x: hidden; }
    #scene { position: fixed; inset: 0; }
    /* empty spacer that gives the page its scroll distance (height set from config) */
    #scroll { position: relative; height: 500vh; pointer-events: none; }
    canvas { display: block; }
    @font-face {
      font-family: 'FK Display';
      src: url('./assets/fonts/FKDisplay-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    /* Tagline: fixed over the canvas (so it holds still while the gallery flies
       past); once the hero's scroll is used up it scrolls away with the page as
       #intro arrives. Each line is revealed with a small 3D tip-up driven by the
       scroll (see updateTagline). */
    #tagline {
      position: fixed;
      inset: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      perspective: 1100px;
      font-family: 'FK Display', system-ui, sans-serif;
      font-weight: 400;
      font-size: min(7.6vw, 13vh);
      line-height: 1;
      letter-spacing: -0.01em;
      color: #0b0b0b;
      text-align: center;
    }
    #tagline .line {
      display: block;
      white-space: nowrap;
      transform-origin: 50% 100%;
      opacity: 0;
      will-change: transform, opacity;
    }
    /* Site header: Halo logo top-left, burger top-right, over everything. The bar
       itself lets the pointer through (so hover-knocking the blocks still works);
       only the logo link and the button take clicks. */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(18px, 2.2vw) max(18px, 2.4vw) 0 max(18px, 2.65vw);
      color: #0b0b0b;
      pointer-events: none;
    }
    #site-header a, #site-header button { pointer-events: auto; }
    .logo { display: block; line-height: 0; color: inherit; }
    .logo svg { width: clamp(64px, 5.8vw, 120px); height: auto; display: block; }
    .burger {
      width: clamp(36px, 3vw, 60px);
      aspect-ratio: 2.2;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(6px, 0.45vw, 10px);
    }
    .burger span { display: block; height: 2px; background: currentColor; transition: transform 0.25s ease; }
    .burger:hover span:first-child { transform: translateY(-1px); }
    .burger:hover span:last-child { transform: translateY(1px); }
    /* Option A / Option B: switch between intro versions (reloads with ?option=). */
    #options {
      position: fixed;
      left: max(18px, 2.65vw);
      bottom: max(18px, 2.2vw);
      z-index: 10;
      display: flex;
      gap: 8px;
    }
    #options button {
      font-family: 'FK Display', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1;
      padding: 9px 14px 8px;
      border: 1px solid #0b0b0b;
      border-radius: 999px;
      background: transparent;
      color: #0b0b0b;
      cursor: pointer;
    }
    #options button[aria-pressed="true"] { background: #0b0b0b; color: #fff8e6; }
    /* Structure Hero headline: left side, vertically centred beside the
       structure (structure.js shows it). */
    #structure-title {
      position: fixed;
      left: max(18px, 2.65vw);
      top: 50%;
      z-index: 2;
      margin: 0;
      display: none;
      font-family: 'FK Display', system-ui, sans-serif;
      font-weight: 400;
      font-size: min(10.5vw, 19vh);   /* same as Culture's headline */
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: #0b0b0b;
      pointer-events: none;
      transform: translateY(-50%);
    }
    #structure-title .line, #culture-hero .line { display: block; white-space: nowrap; opacity: 0; animation: title-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    #structure-title .line:nth-child(1), #culture-hero h1 .line:nth-child(1) { animation-delay: 0.5s; }
    #structure-title .line:nth-child(2), #culture-hero h1 .line:nth-child(2) { animation-delay: 0.65s; }
    @keyframes title-in { from { opacity: 0; transform: translateY(0.4em); } to { opacity: 1; transform: none; } }
    /* Culture: big "Built Together" headline with the "Our culture" subtitle and
       a short paragraph side by side underneath, the whole block vertically
       centred on the left (culture.js shows it). */
    @font-face {
      font-family: 'Space Grotesk';
      src: url('./assets/fonts/SpaceGrotesk-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Space Grotesk';
      src: url('./assets/fonts/SpaceGrotesk-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    #culture-hero {
      position: fixed;
      left: max(18px, 2.65vw);
      top: 50%;
      z-index: 2;
      display: none;
      color: #0b0b0b;
      pointer-events: none;
      transform: translateY(-50%);
    }
    #culture-hero h1 {
      margin: 0;
      font-family: 'FK Display', system-ui, sans-serif;
      font-weight: 400;
      font-size: min(10.5vw, 19vh);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    #culture-hero .copy {
      display: flex;
      align-items: baseline;
      gap: max(16px, 2.5vw);
      margin-top: min(4.5vw, 8vh);
      padding-left: 0.2vw;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    #culture-hero h2 {
      margin: 0;
      flex: none;
      font-weight: 700;
      font-size: clamp(16px, 1.65vw, 34px);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    #culture-hero p {
      margin: 0;
      width: 15em;
      font-weight: 400;
      font-size: clamp(14px, 1.4vw, 28px);
      line-height: 1.24;
    }
    #culture-hero .copy .line { white-space: normal; animation-delay: 0.85s; }
    #culture-hero .copy p.line { animation-delay: 0.95s; }
    @media (max-aspect-ratio: 1/1) {
      #culture-hero .copy { flex-direction: column; gap: 10px; }
    }
    /* First homepage section. The hero ends on the yellow circle filling the
       screen, so this starts the same yellow and scrolls up over the fixed
       canvas seamlessly. Placeholder until the real layout/content lands. */
    #intro {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      background: #e5ff00;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <header id="site-header">
    <a class="logo" href="./" aria-label="Halo home">
      <svg viewBox="0 0 80 34" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M23.4679 33.3116L18.5155 33.3215L18.5141 18.525H4.95385V33.3201L0 33.3173V0.0312371L4.95385 0.0340769V13.9403H18.5141L18.5155 0.032657H23.4679V33.3116Z"/>

    </a>
    <button class="burger" type="button" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>
  <div id="options" role="group" aria-label="Intro version">
    <button type="button" data-option="a" aria-pressed="true">HP Hero A</button>
    <button type="button" data-option="b" aria-pressed="false">HP Hero B</button>
    <button type="button" data-option="c" aria-pressed="false">Structure Hero</button>

  <div id="scene"></div>
  <h1 id="tagline">
    <span class="line">Raising the bar</span>
    <span class="line">for temporary</span>

  </h1>
  <h1 id="structure-title">
    <span class="line">The Halo</span>
    <span class="line">Structure</span>
  </h1>
  <div id="culture-hero">
    <h1>
      <span class="line">Built</span>
      <span class="line">Together</span>
    </h1>
    <div class="copy">
      <h2 class="line">Our culture</h2>
      <p class="line">At Halo, we believe the best work happens when talented people trust one another, share ideas openly and take pride in what they create.</p>
    </div>
  </div>
  <div id="scroll"></div>
  <section id="intro"></section>
  <!-- inline import (not a static src) so the preload scanner can't fetch it
       before the <base> fix above takes effect -->
  <script type="module">
    // ?option= picks the hero: a / b = the H scroll story (two intros, main.js),
    // c = the orbiting line-drawing structure (structure.js), d = Culture, the
    // original isometric "#" scene (culture.js). The buttons show
    // which is playing; picking another reloads with it so it plays from the top.
    const option = ['a', 'b', 'c', 'd'].includes(new URLSearchParams(location.search).get('option'))
      ? new URLSearchParams(location.search).get('option') : 'a';
    for (const btn of document.querySelectorAll('#options button')) {
      btn.setAttribute('aria-pressed', String(btn.dataset.option === option));
      btn.addEventListener('click', () => {
        if (btn.dataset.option === option) return;
        const url = new URL(location.href);
        url.searchParams.set('option', btn.dataset.option);
        location.href = url.toString();
      });
    }
    import({ c: './src/structure.js', d: './src/culture.js' }[option] ?? './src/main.js');
  </script>

</html>
