  <script>
    // Relative asset URLs need the directory form of the URL. Some servers
    // serve this page at ".../spaceman-shards" (no slash) without

    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
