<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iso Hash</title>
  <!-- inline favicon: no /favicon.ico request, so no 404 on the server -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M10%204%20L8%2028%20M24%204%20L22%2028%20M4%2011%20L28%2011%20M4%2021%20L28%2021'%20fill='none'%20stroke='%23222'%20stroke-width='3'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #e9e9e4; overflow: hidden; }
    #scene { position: fixed; inset: 0; }
    canvas { display: block; }
    /* Oversized "Built Together" wordmark, bottom-left, sized like the reference
       (53% of the width, ~3.4% left / ~4.4% bottom margins). It never takes the
       pointer, so the bars behind it can still be knocked about. */
    #wordmark {
      position: fixed;
      left: 3.4vw;
      bottom: 4.4vw;
      width: 53vw;
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
    }
    @media (max-aspect-ratio: 1/1) {
      #wordmark { width: 80vw; left: 6vw; bottom: 8vw; }
    }
  </style>
  <script>
    // lab.piper.vision serves this page at an extensionless URL with no
    // trailing slash, which makes ./src and ./vendor resolve one level up.
    // Injecting <base> pins relative URLs (incl. the import map) to this page.
    (function () {
      var p = location.pathname;
      if (!/\.[a-z0-9]+$/i.test(p) && p.charAt(p.length - 1) !== '/') {
        document.write('<base href="' + p + '/">');
      }
    })();
  </script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <div id="scene"></div>
  <img id="wordmark" src="./assets/built.svg" alt="Built Together" draggable="false" />
  <!-- inline import (not a static src) so the preload scanner can't fetch it
       before the <base> fix above takes effect -->
  <script type="module">import './src/main.js';</script>
</body>
</html>
