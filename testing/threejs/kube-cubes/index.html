<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kube Cubes — self-healing cluster</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #020203;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Soft vignette over the scene, matching the reference's dark corners */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 120% 90% at 50% 42%, transparent 55%, rgba(0,0,0,0.55) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.35), transparent 22%);
    }
  </style>
  <script>
    // Some servers serve the directory URL without a trailing slash and
    // without redirecting — normalize so relative module URLs resolve.
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
