<script>
  // lab.piper.vision serves this page at an extensionless URL with no trailing slash, which makes
  // src/, vendor/ and assets/ resolve one level up. Injecting <base> pins every relative URL (the
  // import map and the @font-face urls included) to this page. Must come before anything relative.
  (function () {
    var p = location.pathname;
    if (!/\.[a-z0-9]+$/i.test(p) && p.charAt(p.length - 1) !== '/') document.write('<base href="' + p + '/">');
  })();

  .sub-links a::before { content: ''; position: absolute; z-index: -1; inset: 0.08em -0.2em 0.04em -0.2em; background: #e6ff00;

  .sub.open .sub-photo .tape.tug { animation: tape-tug 0.55s cubic-bezier(0.34, 1.6, 0.64, 1); }
  @keyframes tape-tug { 0% { transform: translateY(-50%); } 35% { transform: translateY(-75%) rotate(-5deg); } 100% { transform: translateY(-50%); } }

<div id="stage"></div>

<!-- Pixel transition into / out of the menu (from iso-h): the screen fills with modular
     pixels (some 2 or 3 long, or 2 x 2), each scaling in along one axis, then they clear.
     Here they sweep in from the TOP RIGHT corner (where the burger is) rather than at random. -->
<canvas id="pixels" aria-hidden="true"></canvas>
<script>
(function () {
  var PALETTES = {
    menu: ['#191919', '#1d1d1d', '#151515', '#212121', '#1b1b1b', '#171717'],   // the menu's near-black
    page: ['#fff8e6', '#fbf3de', '#fffbee', '#f7efd7', '#fdf5e0', '#f3ead0'],   // the page's cream
  };
  var ACROSS = 6, COVER_MS = 420, REVEAL_MS = 520, REVEAL_DELAY = 115, STRETCH_MS = 155;
  var ORIGIN = [1, 0];   // where the sweep starts, as a fraction of the screen (1, 0 = top right)
  var JITTER = 0.22;     // how ragged the sweep's front is (0 = a clean diagonal wipe)
  var SHAPES = [[1, 1, 6], [2, 1, 2], [1, 2, 2], [3, 1, 1], [1, 3, 1], [2, 2, 1]];
  var cv = document.getElementById('pixels'), cx = cv.getContext('2d');
  var cell = 0, tiles = [], SHADES = PALETTES.menu, gw = 1, gh = 1, BACK = false;
  function pickShape() {
    var total = 0, i; for (i = 0; i < SHAPES.length; i++) total += SHAPES[i][2];
    var r = Math.random() * total;
    for (i = 0; i < SHAPES.length; i++) { r -= SHAPES[i][2]; if (r < 0) return SHAPES[i]; }
    return SHAPES[0];
  }
  function useGrid() { cx.setTransform(cell, 0, 0, cell, 0, 0); }
  // order the pixels by distance from the origin corner, with a little randomness;
  // BACK reverses it, so the wave travels in from the far corner and ends at the origin
  function sweepOrder() {
    var ox = ORIGIN[0] * gw, oy = ORIGIN[1] * gh, far = Math.hypot(gw, gh);
    tiles.forEach(function (t) {
      t.k = Math.hypot(t.x + t.w / 2 - ox, t.y + t.h / 2 - oy) / far + Math.random() * JITTER;
    });
    tiles.sort(function (a, b) { return BACK ? b.k - a.k : a.k - b.k; });
  }
  function setup() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.ceil(innerWidth * dpr), h = Math.ceil(innerHeight * dpr);
    cv.width = w; cv.height = h;
    cell = Math.max(96, Math.round(Math.max(w, h) / ACROSS));
    var cols = Math.ceil(w / cell) + 1, rows = Math.ceil(h / cell) + 1;
    gw = w / cell; gh = h / cell;
    var used = new Uint8Array(cols * rows);
    var free = function (c, r, sw, sh) {
      if (c + sw > cols || r + sh > rows) return false;
      for (var y = r; y < r + sh; y++) for (var x = c; x < c + sw; x++) if (used[y * cols + x]) return false;
      return true;
    };
    tiles = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      if (used[r * cols + c]) continue;
      var s = pickShape();
      if (!free(c, r, s[0], s[1])) s = SHAPES[0];
      for (var y = r; y < r + s[1]; y++) for (var x = c; x < c + s[0]; x++) used[y * cols + x] = 1;
      if (c * cell >= w || r * cell >= h) continue;
      tiles.push({ x: c, y: r, w: s[0], h: s[1], shade: SHADES[Math.floor(Math.random() * SHADES.length)],
        axisX: s[0] > s[1] || (s[0] === s[1] && Math.random() < 0.5), flip: Math.random() < 0.5 });
    }
    sweepOrder();
    useGrid();
  }
  function draw(t, f) {
    var w = t.axisX ? t.w * f : t.w, h = t.axisX ? t.h : t.h * f;
    if (w <= 0 || h <= 0) return;
    var e = 1 / cell;
    cx.fillStyle = mixed(t.shade);
    cx.fillRect((t.flip && t.axisX ? t.x + t.w - w : t.x) - e, (t.flip && !t.axisX ? t.y + t.h - h : t.y) - e, w + 2 * e, h + 2 * e);
  }
  // SOLID_MIX 0..1 blends every pixel's shade towards the solid menu colour (1 = one flat colour)
  var SOLID = '#191919', SOLID_MIX = 0, FADE_MS = 280;
  var UNMELT_MS = 140;   // closing: how fast the flat cover breaks back into pixel shades before they sweep out
  var EARLY_AT = 0.85;   // the menu's links + contact start animating in this far through the pixel sweep
  var hex = function (c) { return [1, 3, 5].map(function (i) { return parseInt(c.substr(i, 2), 16); }); };
  function mixed(c) {
    if (SOLID_MIX <= 0) return c;
    var a = hex(c), b = hex(SOLID), m = SOLID_MIX;
    return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * m); }).join(',') + ')';
  }
  function drawAll() { cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); useGrid(); for (var i = 0; i < tiles.length; i++) draw(tiles[i], 1); }
  // animate fn(u) for u 0..1 over ms, then done
  function tween(ms, fn, done) {
    var start = performance.now();
    (function step(now) { var u = Math.min(1, (now - start) / ms); fn(u); if (u < 1) requestAnimationFrame(step); else if (done) done(); })(start);
  }
  function clearTile(t) { var e = 1 / cell; cx.clearRect(t.x - e, t.y - e, t.w + 2 * e, t.h + 2 * e); }
  var easeOut = function (u) { return 1 - Math.pow(1 - u, 3); };
  var runId = 0;
  function run(on, ms, done) {
    var mine = ++runId, list = tiles.slice(), n = list.length, start = performance.now();
    (function step(now) {
      if (mine !== runId) return;
      var finished = 0;
      for (var i = 0; i < n; i++) {
        var t = list[i], g = (now - start - (i / n) * ms) / STRETCH_MS;
        if (g < 0 || t.done) { if (t.done) finished++; continue; }
        if (g >= 1) g = 1;
        var f = easeOut(g);
        clearTile(t);
        if (on) draw(t, f); else if (g < 1) draw(t, 1 - f);
        if (g >= 1) { t.done = true; finished++; }
      }
      if (finished < n) requestAnimationFrame(step);
      else {
        for (i = 0; i < n; i++) list[i].done = false;
        if (!on) { cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); useGrid(); }
        if (done) done();
      }
    })(start);
  }
  var busy = false;
  window.pixelTransition = {
    // open: pixels sweep in, fade to the flat menu colour, change() behind, the cover fades out.
    // back (close): the reverse, a flat cover fades in, change() behind, it breaks into pixels
    // that clear with the wave ending at the origin corner
    // back: true = the wave runs the other way, finishing at the origin corner (closing the menu)
    // early(): optional, called EARLY_AT of the way through the opening pixel sweep
    swap: function (change, palette, back, early) {
      if (busy) return false;
      busy = true;
      BACK = !!back;
      SHADES = PALETTES[palette] || PALETTES.menu;
      setup();
      var finish = function () { busy = false; SOLID_MIX = 0; cv.style.opacity = ''; };
      if (!BACK) {
        // OPEN: pixels sweep in from the corner, their shades melt into the menu's flat colour,
        // the menu goes in behind, and the flat cover fades away to it
        SOLID_MIX = 0;
        if (early) setTimeout(early, (COVER_MS + STRETCH_MS) * EARLY_AT);
        run(true, COVER_MS, function () {
          tween(FADE_MS, function (u) { SOLID_MIX = u; drawAll(); }, function () {
            change();
            tween(FADE_MS, function (u) { cv.style.opacity = 1 - u; }, function () {
              cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cv.width, cv.height); useGrid(); finish();
            });
          });
        });
      } else {
        // CLOSE (the reverse): a flat cover fades in over the menu, the page goes in behind,
        // the cover breaks up into pixel shades, and they clear, the wave ending at the corner
        SOLID_MIX = 1; drawAll(); cv.style.opacity = 0;
        tween(FADE_MS, function (u) { cv.style.opacity = u; }, function () {
          change();
          // break up into pixel shades quickly and go straight into the reverse sweep (no pause)
          tween(UNMELT_MS, function (u) { SOLID_MIX = 1 - u; drawAll(); }, function () {
            run(false, REVEAL_MS, finish);
          });
        });
      }
      return true;
    },
  };
})();
</script>

  // wrong path before the <base> fix above applies; they still load and run in order
  ['src/config.js', 'src/gallery.js', 'src/carousel.js', 'src/trail.js', 'src/end.js', 'src/main.js']

<script type="module">import './src/intro3d.js';</script>
<script type="module">
  // Menu (from iso-h): the burger opens it through the pixel transition (dark pixels in from
  // the top right), the X or Escape closes it (cream pixels back out). The 3D H loads the first time.
  const menu = document.getElementById('menu');
  const BRAND_ARROW = menu.querySelector('.menu-contact path').getAttribute('d');
  for (const a of menu.querySelectorAll('.menu-nav a')) {
    a.innerHTML = '<svg class="arrow" viewBox="0 0 144 124" aria-hidden="true"><path d="' + BRAND_ARROW + '"/></svg>'
      + '<span class="label">' + a.textContent + '</span>';
  }
  // load the 3D H up front, so it's ready (and its canvas drawn) the moment the menu first opens
  let art = import('./src/menu.js');
  const burger = () => document.querySelector('#end .burger-btn');
  // 85% through the pixel sweep: the links + contact start animating in ON TOP of the pixels
  // (the menu sits above them with no background of its own until the cover has gone)
  function introMenu() {
    menu.classList.add('open', 'play', 'over');
    menu.setAttribute('aria-hidden', 'false');
    burger()?.setAttribute('aria-expanded', 'true');
  }
  // once the pixels have melted to the flat menu colour: the menu drops behind with its own
  // background, the 3D H starts, and the cover fades off
  function openMenu() {
    if (!menu.classList.contains('open')) introMenu();
    document.documentElement.classList.add('menu-open');
    // the H's canvas is shown only once it has drawn its first (blank) frame
    (art ??= import('./src/menu.js')).then(m => { m.start(); menu.classList.remove('over'); });
  }
  function closeMenu() {
    menu.classList.remove('open', 'play', 'over', 'under');
    closeSub?.();   // panels reset with the menu
    menu.setAttribute('aria-hidden', 'true');
    burger()?.setAttribute('aria-expanded', 'false');
    document.documentElement.classList.remove('menu-open');
    art?.then(m => m.stop());
    burger()?.focus();
  }
  // the burger is built by end.js (and rebuilt when the layout changes), so listen on the page
  document.addEventListener('click', e => {
    if (e.target.closest('#end .burger-btn')) window.pixelTransition.swap(openMenu, 'menu', false, introMenu);
  });
  // closing: the menu breaks up into its own near-black pixels (no extra cream layer), the menu
  // goes behind them, and they clear to reveal the page, the wave running back to the burger's corner
  const leaveMenu = () => { if (window.pixelTransition.swap(closeMenu, 'menu', true)) menu.classList.add('under'); };
  menu.querySelector('.menu-close').addEventListener('click', leaveMenu);
  addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !menu.classList.contains('open')) return;
    if (menu.classList.contains('sub-open')) closeSub(); else leaveMenu();   // Escape backs out one level
  });

  // ---- Dropdown panels -------------------------------------------------------------------------
  // photos: a path, or a placeholder colour until James sends the rest
  const SUBS = {
    offer: {
      title: 'What we offer',
      // James' outlined SVGs (Resources/SVGs): fill = stretch edge to edge across the frame;
      // the others use the first word's scale. w/h = each SVG's viewBox.
      words: [
        { src: 'assets/menu/words/offer-what.svg', w: 684, h: 219, fill: true },
        { src: 'assets/menu/words/offer-we.svg', w: 427, h: 180 },
        { src: 'assets/menu/words/offer-offer.svg', w: 679, h: 241, fill: true },
      ],
      links: [
        { label: 'All builds', photo: 'assets/menu/offer-all-builds.jpg' },
        { label: 'Indoor', photo: 'assets/menu/offer-indoor.jpg' },
        { label: 'Outdoor', photo: 'assets/menu/offer-outdoor.jpg' },
        { label: 'Semi', photo: 'assets/menu/offer-semi.jpg' },
        { label: 'Bespoke', photo: 'assets/menu/offer-bespoke.jpg' },
      ],
    },
  };
  const panels = {};
  for (const [key, S] of Object.entries(SUBS)) {
    const p = document.createElement('div');
    p.className = 'sub';
    p.setAttribute('aria-hidden', 'true');
    p.innerHTML =
      '<div class="sub-frame"><svg preserveAspectRatio="none" aria-hidden="true"><rect pathLength="1" x="1" y="1" /></svg>' +
      '<div class="sub-words">' + S.words.map((w, i) => '<div class="w" style="--i:' + i + '"><img src="' + w.src + '" alt=""></div>').join('') + '</div></div>' +
      '<nav class="sub-links" aria-label="' + S.title + '">' +
      S.links.map((l, i) => '<div class="m"><a href="#" data-i="' + i + '" style="--i:' + i + '">' + l.label + '</a></div>').join('') + '</nav>' +
      '<div class="sub-photo"><div class="frame"></div><i class="tape"></i></div>';
    menu.insertBefore(p, menu.querySelector('.menu-close'));
    panels[key] = { el: p, S, shown: -1 };
    // load the photos up front so hovering swaps them instantly
    S.links.forEach(l => { if (!l.photo.startsWith('#')) new Image().src = l.photo; });
  }
  const paint = (pic, photo, label) => {
    if (photo.startsWith('#')) { pic.style.background = photo; pic.innerHTML = '<span class="ph">' + label + ' — photo to come</span>'; }
    else pic.style.backgroundImage = 'url("' + photo + '")';
  };
  // show photo i: the new one wipes up over the old, and the tape gives a tug
  function showPhoto(P, i, instant) {
    if (P.shown === i) return;
    P.shown = i;
    const frame = P.el.querySelector('.frame'), pic = document.createElement('div');
    pic.className = 'pic' + (instant ? '' : ' enter');
    paint(pic, P.S.links[i].photo, P.S.links[i].label);
    frame.appendChild(pic);
    if (instant) { [...frame.children].slice(0, -1).forEach(c => c.remove()); return; }
    // when a photo has finished wiping in, drop only the layers BENEATH it: a newer photo that's
    // still wiping in above it (fast hovering up and down) keeps its background intact
    pic.addEventListener('animationend', () => {
      for (let s = pic.previousElementSibling; s; ) { const prev = s.previousElementSibling; s.remove(); s = prev; }
      pic.classList.remove('enter');
    }, { once: true });
    // never stack more than a few layers mid-wipe
    while (frame.children.length > 4) frame.firstElementChild.remove();
    const tape = P.el.querySelector('.tape');
    tape.classList.remove('tug'); void tape.offsetWidth; tape.classList.add('tug');
    P.el.querySelectorAll('.sub-links a').forEach((a, k) => a.classList.toggle('on', k === i));
  }
  // the huge words (SVGs): the 'fill' words span the frame exactly edge to edge, the first sits on
  // the frame's top, the last on its bottom, and any others are centred in the gap between them
  function fitWords(P) {
    const box = P.el.querySelector('.sub-frame');
    const ws = [...P.el.querySelectorAll('.sub-words .w')], D = P.S.words;
    const W = box.clientWidth, H = box.clientHeight, base = W / D[0].w;
    const sz = D.map(d => { const s = d.fill ? W / d.w : base; return [d.w * s, d.h * s]; });
    const n = ws.length, topY = 0, botY = H - sz[n - 1][1];
    const gapTop = sz[0][1], gapBot = botY;
    ws.forEach((w, i) => {
      const [ww, hh] = sz[i];
      const y = i === 0 ? topY : i === n - 1 ? botY : (gapTop + gapBot) / 2 - hh / 2;
      Object.assign(w.style, { top: y + 'px', width: ww + 'px', height: hh + 'px' });
    });
    const r = P.el.querySelector('.sub-frame rect');
    r.setAttribute('width', Math.max(0, W - 2)); r.setAttribute('height', Math.max(0, H - 2));
  }
  let openSub = null;
  function openPanel(key, link) {
    const P = panels[key];
    if (openSub === P) return closeSub();
    if (openSub) closeSub();
    fitWords(P);
    showPhoto(P, 0, true);
    P.el.querySelectorAll('.sub-links a').forEach((a, k) => a.classList.toggle('on', k === 0));
    P.el.classList.add('open'); P.el.setAttribute('aria-hidden', 'false');
    menu.classList.add('sub-open');
    menu.querySelectorAll('.menu-nav a').forEach(a => a.classList.toggle('active', a === link));
    openSub = P;
  }
  function closeSub() {
    if (!openSub) return;
    openSub.el.classList.remove('open'); openSub.el.setAttribute('aria-hidden', 'true');
    menu.classList.remove('sub-open');
    menu.querySelectorAll('.menu-nav a.active').forEach(a => a.classList.remove('active'));
    openSub = null;
  }
  menu.querySelectorAll('.menu-nav a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    if (a.dataset.sub) openPanel(a.dataset.sub, a); else closeSub();
  }));
  for (const P of Object.values(panels)) {
    P.el.querySelectorAll('.sub-links a').forEach(a => {
      a.addEventListener('mouseenter', () => showPhoto(P, +a.dataset.i));
      a.addEventListener('focus', () => showPhoto(P, +a.dataset.i));
      a.addEventListener('click', e => e.preventDefault());
    });
  }
  addEventListener('resize', () => { if (openSub) fitWords(openSub); });
  window.haloMenu = { open: () => window.pixelTransition.swap(openMenu, 'menu', false, introMenu), close: leaveMenu,
    sub: key => openPanel(key, menu.querySelector('[data-sub="' + key + '"]')), closeSub };
</script>
